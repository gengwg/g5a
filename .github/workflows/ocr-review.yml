name: ocr-review

# AI review of each pull request. The job lives in gengwg/ci-workflows;
# update the pinned commit to adopt reviewed changes there.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: gengwg/ci-workflows/.github/workflows/ocr-review.yml@c88fa4c09d50367df9a4d804bdae36917e0e10f5 # main, 2026-11-20
    with:
      llm_url: ${{ vars.OCR_LLM_URL }}
      llm_model: ${{ vars.OCR_LLM_MODEL }}
    secrets:
      llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
