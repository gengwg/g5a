name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
      - run: make test
      - run: make test-race
      - run: make test-integration
      - run: make test-terminal
      - name: Print terminal transcripts on failure
        if: failure()
        run: |
          find /tmp -maxdepth 2 -path '/tmp/g5a-e2e-*/*.txt' \
            -exec sh -c 'for file; do echo "--- $file"; tail -40 "$file"; done' _ {} +
