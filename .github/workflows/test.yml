name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - run: make test
      - run: make test-race
      - run: make test-integration
      - run: make test-terminal
      - name: Print terminal transcripts on failure
        if: failure()
        run: |
          find /tmp -maxdepth 2 -path '/tmp/g5a-e2e-*/*.txt' \
            -exec sh -c 'for file; do echo "--- $file"; tail -40 "$file"; done' _ {} +
